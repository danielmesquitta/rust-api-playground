version: 2
updates:
  # Rust dependencies. If a bump raises the minimum Rust version, the `msrv` CI job fails.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  # Actions used by the workflows. They are pinned by SHA with a `# vX.Y.Z` comment,
  # which Dependabot updates together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
